{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block dash_title %}VETA Hotel Dashboard{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    {% block dash_css %}{% endblock %}
</head>
<body>
    <div class="dash-app">
        {% include 'dashboard/includes/sidebar.html' %}
        <div class="dash-main">
            {% include 'dashboard/includes/navbar.html' %}
            <div class="dash-content">
                {% block dash_content %}{% endblock %}
            </div>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <script src="{% static 'js/dashboard.js' %}"></script>
    {% block dash_js %}{% endblock %}
</body>
</html>
