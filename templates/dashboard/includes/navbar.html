<nav class="dash-navbar">
    <div class="navbar-left">
        <button class="hamburger-btn" id="sidebarToggle" aria-label="Menu">
            <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-title">
            {% block page_title %}Dashboard{% endblock %}
            <span>| {% now "d M Y" %}</span>
        </div>
    </div>
    <div class="navbar-right">
        <form id="navbarSearchForm" style="position:relative;">
            <input type="text" placeholder="Search..." 
                   style="width:200px;padding:8px 12px 8px 34px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:0.8125rem;font-family:Inter,sans-serif;background:var(--gray-50);">
            <i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:0.75rem;"></i>
        </form>
        <button class="navbar-icon-btn"><i class="fas fa-bell"></i><span class="notification-dot"></span></button>
        <div class="navbar-profile">
            <div class="sidebar-avatar" style="width:34px;height:34px;font-size:0.75rem;">{{ user.first_name.0 }}{{ user.last_name.0 }}</div>
        </div>
    </div>
</nav>
